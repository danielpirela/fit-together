# OpenSpec Configuration — Together Habit Tracking
# Generated for SDD Phase: init

version: 1.0
project: together-habit-tracking
sdds:
  - id: together-habit-tracking-app
    name: Together Habit Tracking
    description: Minimalist iOS habit tracking app for couples with Apple HIG design, Clean Architecture, and Supabase backend
    created_at: 2026-06-02

# ─────────────────────────────────────────────────────────────
# SDD Execution Settings
# ─────────────────────────────────────────────────────────────

preflight:
  execution_mode: interactive
  artifact_store: both
  chained_pr_strategy: auto-forecast
  review_budget_lines: 300

# ─────────────────────────────────────────────────────────────
# Strict TDD (disabled for initial scaffold)
# ─────────────────────────────────────────────────────────────

strict_tdd:
  enabled: false
  test_command: null
  note: "Enable after initial project scaffold and test infrastructure setup"

# ─────────────────────────────────────────────────────────────
# Skill Registry
# ─────────────────────────────────────────────────────────────

skill_registry_path: .atl/skill-registry.md

skills:
  # Project Skills
  - react-native
  - expo-tailwind-setup
  - tailwind-design-system
  - typescript
  - supabase
  - supabase-postgres-best-practices

  # UI/UX
  - ui-ux-pro-max

  # Quality
  - judgment-day
  - work-unit-commits

# ─────────────────────────────────────────────────────────────
# Project Structure
# ─────────────────────────────────────────────────────────────

folders:
  src:
    - core/entities
    - core/repositories
    - core/use-cases
    - features/auth/screens
    - features/auth/components
    - features/habits/screens
    - features/habits/components
    - features/couple/screens
    - features/couple/components
    - shared/components
    - shared/hooks
    - shared/lib
    - shared/types
    - shared/constants
  docs:
    - docs
  supabase:
    - supabase/migrations

# ─────────────────────────────────────────────────────────────
# Design System Tokens
# ─────────────────────────────────────────────────────────────

design:
  name: "iOS Minimalist"
  guidelines: "Apple Human Interface Guidelines"
  typography:
    font_family: "SF Pro"
    fallback: "System"
  colors:
    primary:
      green: "#34C759" # Partner / completion
      purple: "#AF52DE" # User / accent
    semantic:
      red: "#FF3B30" # Individual completion
      success: "#34C759"
      warning: "#FF9500"
      error: "#FF3B30"
    neutral:
      background: "#F2F2F7"
      surface: "#FFFFFF"
      text: "#000000"
      secondary_text: "#8E8E93"
  spacing:
    base: 4
    scale: [0, 4, 8, 12, 16, 20, 24, 32, 40, 48, 64]

# ─────────────────────────────────────────────────────────────
# Supabase Schema (planned)
# ─────────────────────────────────────────────────────────────

supabase:
  auth:
    methods:
      - email_password
      - magic_link
    providers: []
  database:
    tables:
      - users
      - couples
      - habits
      - completions
      - invitations
  realtime:
    channels:
      - completions
      - couple_presence

# ─────────────────────────────────────────────────────────────
# Conventions
# ─────────────────────────────────────────────────────────────

conventions:
  component_naming: "PascalCase"
  hook_naming: "camelCase with use prefix"
  utility_naming: "camelCase"
  constant_naming: "SCREAMING_SNAKE_CASE"
  table_naming: "snake_case plural"
  branch_format: "feat|fix|chore/<ticket>/<description>"
  commit_format: "feat|fix|chore: <description>"

# ─────────────────────────────────────────────────────────────
# Testing
# ─────────────────────────────────────────────────────────────

testing:
  framework: "jest"
  preset: "jest-expo"
  coverage_target:
    entities: 100
    use_cases: 100
    shared_components: 80
    feature_components: 70
    hooks: 80

# ─────────────────────────────────────────────────────────────
# Next Steps Tracking
# ─────────────────────────────────────────────────────────────

next_steps:
  - task: "Scaffold Expo project"
    command: "npx create-expo-app@latest ."
    blocking: false
  - task: "Configure Tailwind/NativeWind"
    skill: "expo-tailwind-setup"
    blocking: true
  - task: "Set up Supabase client and types"
    skill: "supabase"
    blocking: true
  - task: "Initialize Clean Architecture folders"
    blocking: false
  - task: "Create database migrations"
    blocking: true
